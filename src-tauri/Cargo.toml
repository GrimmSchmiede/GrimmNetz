[package]
name = "grimmnetz"
version = "0.1.31"
description = "GrimmNetz - ServerManager für Gamer"
authors = ["GrimmSchmiede"]
license = "GPL-3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grimmnetz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# SSH client (async, pure Rust)
russh = "0.45"
russh-keys = "0.45"

# OS Keyring integration (Windows Credential Manager / Gnome Keyring / KWallet)
# NOTE: platform backends are opt-in - without this feature, keyring silently
# falls back to a non-persistent mock store on Windows.
keyring = { version = "3", features = ["windows-native"] }

# Encrypted local database (SQLCipher via bundled OpenSSL)
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

# Local machine system stats (CPU/RAM/network) for the sidebar status widget
sysinfo = "0.32"

anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

